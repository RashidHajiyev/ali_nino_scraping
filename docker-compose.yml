version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: alinino_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password

    ports:
      - "5434:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
